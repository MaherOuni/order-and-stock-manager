# Production shape. `docker compose up` on a workstation also picks up
# docker-compose.override.yml, which relaxes this for local work (exposed database port,
# migrations and demo seed on start-up, Swagger).
#
#   Production:  docker compose -f docker-compose.yml up -d --build
#   Local:       docker compose up --build
#
# Every value that differs between environments comes from .env — see .env.example.

services:
  postgres:
    image: postgres:16-alpine
    container_name: orderstock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Deterministic collation regardless of the host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # No published port: only the API needs to reach the database, and it does so over the
    # compose network. The override file opens 5432 for local psql.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1g
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ${API_IMAGE:-orderstock-api:local}
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    container_name: orderstock-api
    restart: unless-stopped
    depends_on:
      postgres:
        # Waits for pg_isready, not just for the container to exist.
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=false"
      # Off in production: schema changes are applied deliberately, not by whichever replica
      # happens to boot first. See the migration Job in k8s/ and the README.
      Database__MigrateOnStartup: ${DATABASE_MIGRATE_ON_STARTUP:-false}
      Database__SeedDemoTenant: ${DATABASE_SEED_DEMO_TENANT:-false}
      # The deployed Angular origin. Anything not listed here is blocked by the browser.
      # For a second origin add `Cors__AllowedOrigins__1` here — an empty entry is not the same
      # as an absent one, so the index is left off rather than defaulted to "".
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_0:?set CORS_ORIGIN_0 in .env}
      # Behind a TLS-terminating proxy, so trust X-Forwarded-Proto/-For for redirects and logs.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    ports:
      - "${API_PORT:-5080}:8080"
    deploy:
      resources:
        limits:
          memory: 512m
    logging: *logging

volumes:
  postgres-data:
