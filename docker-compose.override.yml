# Local development. Compose merges this on top of docker-compose.yml automatically, so
# `docker compose up --build` is the dev experience and
# `docker compose -f docker-compose.yml up -d --build` is the production one.

services:
  postgres:
    ports:
      # psql -h localhost -U orderstock orderstock
      - "5432:5432"

  api:
    environment:
      # Swagger UI, detailed errors, and EF Core command logging.
      ASPNETCORE_ENVIRONMENT: Development
      # Safe here because there is exactly one replica and the data is disposable.
      Database__MigrateOnStartup: "true"
      Database__SeedDemoTenant: "true"
      Cors__AllowedOrigins__0: "http://localhost:4200"
      # Npgsql includes parameter values in errors; useful locally, leaky in production.
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-orderstock};Username=${POSTGRES_USER:-orderstock};Password=${POSTGRES_PASSWORD:-orderstock};Include Error Detail=true"
