# ClusterIP: reachable as `postgres` (or postgres.<namespace>.svc) from inside the cluster and
# from nowhere else. The database is deliberately not exposed through the Ingress.
#
# For a psql session against it:
#   kubectl port-forward svc/postgres 5432:5432
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: orderstock
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
