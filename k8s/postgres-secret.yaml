# Credentials, in one place so no other manifest has to contain them.
#
# THIS FILE IS A TEMPLATE. Do not commit real values — a Kubernetes Secret is base64, not
# encryption, and anyone with read access to the namespace can decode it. For anything real,
# create the Secret out of band and delete this file:
#
#   kubectl create secret generic postgres-credentials \
#     --from-literal=POSTGRES_DB=orderstock \
#     --from-literal=POSTGRES_USER=orderstock \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=ConnectionStrings__Default="Host=postgres;Port=5432;Database=orderstock;Username=orderstock;Password=<same password>"
#
# …or manage it with Sealed Secrets / External Secrets / your cloud's secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: orderstock
type: Opaque
# stringData so the file stays readable; Kubernetes base64-encodes it on the way in.
stringData:
  POSTGRES_DB: orderstock
  POSTGRES_USER: orderstock
  POSTGRES_PASSWORD: CHANGE_ME_BEFORE_APPLYING

  # The API reads this whole string as ConnectionStrings:Default. It repeats the credentials
  # above because Npgsql wants one string, and because the API never needs the parts separately.
  # Host is the Service name — Kubernetes DNS resolves it inside the namespace.
  ConnectionStrings__Default: "Host=postgres;Port=5432;Database=orderstock;Username=orderstock;Password=CHANGE_ME_BEFORE_APPLYING;Include Error Detail=false;Maximum Pool Size=20"
